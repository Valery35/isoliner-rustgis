# Isoliner для RustGIS - расширение-процесс на крейте rustgis-kit.
# Copyright (C) 2026 ООО «Информ++». Лицензия Apache 2.0.
# SPDX-License-Identifier: Apache-2.0

[package]
name = "isoliner-rustgis"
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"
authors = ["ООО «Информ++»"]
description = "Isoliner для RustGIS: инструменты модуля QGIS Isoliner (гриды, изолинии, геостатистика) расчётом на Rust"
publish = false

[dependencies]
# общая основа расширений RustGIS линейки, отдельное хранилище. Правка
# крейта на месте - [patch] в .cargo/config.toml или путь вместо git.
rustgis-kit = { git = "https://github.com/Valery35/rustgis-kit", tag = "v0.1.9" }
# float_roundtrip: числа образцов модуля читаются до бита
serde_json = { version = "1", features = ["float_roundtrip"] }
# GeoTIFF для растровых команд: Deflate и LZW, как пишет RustGIS
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }

# сверка 1.09 гоняет решатель минимальной кривизны сотни раз: тесты
# собираются с оптимизацией, иначе идут минутами
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
